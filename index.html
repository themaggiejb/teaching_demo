<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background-image: url("background.png");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        position: relative;
        min-height: 100vh;
      }

      .button-class {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: none;
  padding: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 4px;
}

.button-class img {
  width: 120px;  
  height: auto;
  display: block;
}
    </style>
  </head>

  <body>
   <button class="button-class" onclick="location.href='page.html'">
  <img src="button.png" alt="Build Button"/>
</button>
  </body>
</html>
